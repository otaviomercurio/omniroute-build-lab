name: Manual Stage1 Artes compiled HTTP acceptance (separate lab workflow)

on:
  workflow_dispatch:
    inputs:
      approve_synthetic_stream_draft:
        description: "Execute reviewed synthetic HTTP stream cases on a disposable public Windows runner; retain three sanitized reports plus checksums"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: manual-stage1-artes-http-acceptance
  cancel-in-progress: false

jobs:
  accept-and-retain:
    if: github.event_name == 'workflow_dispatch' && inputs.approve_synthetic_stream_draft && vars.PUBLIC_BUILD_ENABLED == 'true' && github.event.repository.private == false && github.repository == 'otaviomercurio/omniroute-build-lab'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Fetch this exact public workflow commit anonymously and verify frozen recipe
        id: recipe
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GH_TOKEN -or $env:GITHUB_TOKEN) { throw 'Credential forbidden in recipe step' }
          if ($env:GITHUB_SERVER_URL -ne 'https://github.com' -or $env:GITHUB_REPOSITORY -ne 'otaviomercurio/omniroute-build-lab' -or $env:GITHUB_SHA -cnotmatch '^[a-f0-9]{40}$') { throw 'Unexpected repository or exact commit' }
          $checkout = Join-Path $env:RUNNER_TEMP 'stream-acceptance-checkout'
          if (Test-Path -LiteralPath $checkout) { throw 'Fresh checkout required' }
          git init $checkout
          if ($LASTEXITCODE) { throw 'git init failed' }
          git -C $checkout remote add origin "https://github.com/$env:GITHUB_REPOSITORY.git"
          if ($LASTEXITCODE) { throw 'git remote failed' }
          git -C $checkout -c credential.helper= fetch --depth=1 origin $env:GITHUB_SHA
          if ($LASTEXITCODE) { throw 'Anonymous exact-commit fetch failed' }
          git -C $checkout -c core.autocrlf=false checkout --detach FETCH_HEAD
          if ($LASTEXITCODE) { throw 'Exact checkout failed' }
          @'
          import base64,hashlib,io,os,pathlib,re,stat,zipfile
          scratch=pathlib.Path(os.environ['RUNNER_TEMP']); archive=scratch/'stream-acceptance-checkout/stage1-stream-acceptance-recipe.zip.b64'
          expected='c481e9be34afb27408606224ff411a7fb218c0a340f1ef063be00c5f543c0689'; allowed=set(('LAB-NOTES.txt', 'approved-inputs.json', 'harness/Invoke-StreamAcceptance.ps1', 'harness/cleanup-owned.ps1', 'harness/oracles.mjs', 'harness/probe.mjs', 'harness/run-stream-acceptance.mjs', 'harness/verify-inputs.py', 'review-record.json', 'scripts/collector.py', 'scripts/contract.py', 'scripts/node-toolchain.py', 'workflow.template.yml'))
          assert archive.is_file() and archive.stat().st_size<3*1024*1024
          for p in (archive,*archive.parents): assert not p.is_symlink() and not getattr(p.lstat(),'st_file_attributes',0)&0x400
          encoded=archive.read_bytes(); assert re.fullmatch(rb'[A-Za-z0-9+/]+={0,2}\n',encoded)
          data=base64.b64decode(encoded[:-1],validate=True)
          assert base64.b64encode(data)+b'\n'==encoded and len(data)<2*1024*1024 and hashlib.sha256(data).hexdigest()==expected
          dest=scratch/'stream-acceptance-recipe'; assert not dest.exists()
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              infos=z.infolist(); assert len(infos)==len(allowed) and {i.filename for i in infos}==allowed
              assert sum(i.file_size for i in infos)<2*1024*1024
              assert all(not i.flag_bits&1 and i.compress_type in (0,8) and stat.S_IFMT(i.external_attr>>16) in (0,stat.S_IFREG) and not i.external_attr&0x400 for i in infos)
              assert z.testzip() is None; dest.mkdir()
              for i in infos:
                  target=dest/i.filename; assert target.resolve().is_relative_to(dest.resolve())
                  target.parent.mkdir(parents=True,exist_ok=True)
                  with target.open('xb') as f: f.write(z.read(i))
          import sys; sys.path.insert(0,str(dest/'scripts'))
          from contract import package,runner
          runner(); package(dest)
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f: f.write('STREAM_RECIPE='+str(dest)+'\n')
          '@ | python -B -
          if ($LASTEXITCODE) { throw 'Frozen recipe or concrete approval failed; no downloads permitted' }

      - name: Download only four concretely pinned assets from the exact successful build draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $cfg = Get-Content -LiteralPath (Join-Path $env:STREAM_RECIPE 'approved-inputs.json') -Raw | ConvertFrom-Json
          $runText = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$($cfg.sourceRunId)"
          if ($LASTEXITCODE) { throw 'Exact build run lookup failed; no retry' }
          $run = $runText | ConvertFrom-Json
          if ([string]$run.id -cne $cfg.sourceRunId -or [string]$run.run_attempt -cne $cfg.sourceRunAttempt -or $run.head_sha -cne $cfg.sourceRecipeCommit -or $run.status -cne 'completed' -or $run.conclusion -cne 'success' -or $run.event -cne 'workflow_dispatch' -or $run.repository.full_name -cne $cfg.repository -or $run.repository.private -ne $false -or $run.head_repository.full_name -cne $cfg.repository) { throw 'Build identity or successful completion mismatch' }
          if ($cfg.ci.releaseLookup -cne 'exact-tag-and-content-pins' -or $cfg.ci.sourceReleaseIdSource -cne 'runner-discovered' -or $null -ne $cfg.ci.sourceReleaseId) { throw 'Exact draft lookup contract required' }
          $releaseListText = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100&page=1"
          if ($LASTEXITCODE) { throw 'Bounded source release lookup failed; no retry' }
          $releaseList = $releaseListText | ConvertFrom-Json
          $releases = @($releaseList)
          if ($releases.Count -gt 100) { throw 'Source release lookup bound exceeded' }
          $releaseMatches = @($releases | Where-Object { $_.tag_name -ceq $cfg.sourceReleaseTag })
          if ($releaseMatches.Count -ne 1) { throw 'Exactly one source tag must be visible in the bounded lookup' }
          $selectedRelease = $releaseMatches[0]
          if (($selectedRelease.id -isnot [int] -and $selectedRelease.id -isnot [long]) -or $selectedRelease.id -le 0) { throw 'Resolved source release ID must be a positive integer' }
          $resolvedReleaseId = [long]$selectedRelease.id
          $releaseText = gh api "repos/$env:GITHUB_REPOSITORY/releases/$resolvedReleaseId"
          if ($LASTEXITCODE) { throw 'Resolved source draft lookup failed; no retry' }
          $release = $releaseText | ConvertFrom-Json
          if (($release.id -isnot [int] -and $release.id -isnot [long]) -or $release.id -ne $resolvedReleaseId -or $release.draft -isnot [bool] -or !$release.draft -or $release.prerelease -isnot [bool] -or !$release.prerelease -or $release.tag_name -cne $cfg.sourceReleaseTag -or $release.target_commitish -cne $cfg.sourceRecipeCommit) { throw 'Exact source draft identity mismatch' }
          $names = @('runtime-win-x64.zip','runtime-files.json','provenance.json','SHA256SUMS.txt')
          if ($release.assets.Count -ne 4) { throw 'Exact four source assets required' }
          $resolvedAssetIds = @{}
          $uniqueAssetIds = [Collections.Generic.HashSet[long]]::new()
          foreach ($name in $names) {
            $asset = @($release.assets | Where-Object { $_.name -ceq $name })
            if ($asset.Count -ne 1 -or ($asset[0].id -isnot [int] -and $asset[0].id -isnot [long]) -or $asset[0].id -le 0 -or $asset[0].size -ne $cfg.assets.$name.bytes -or $asset[0].state -cne 'uploaded') { throw 'Exact release asset identity or pinned size mismatch' }
            if (!$uniqueAssetIds.Add([long]$asset[0].id) -or $asset[0].url -cne "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/assets/$($asset[0].id)") { throw 'Asset ID duplicate or API origin mismatch' }
            if ($asset[0].digest -cne ('sha256:' + $cfg.assets.$name.sha256)) { throw 'GitHub asset digest missing or mismatched' }
            $resolvedAssetIds[$name] = [long]$asset[0].id
          }
          $incoming = Join-Path $env:RUNNER_TEMP 'stream-acceptance-downloads'
          if (Test-Path -LiteralPath $incoming) { throw 'Fresh download directory required' }
          New-Item -ItemType Directory -Path $incoming | Out-Null
          gh release download $cfg.sourceReleaseTag --repo $env:GITHUB_REPOSITORY --dir $incoming --pattern runtime-win-x64.zip --pattern runtime-files.json --pattern provenance.json --pattern SHA256SUMS.txt
          if ($LASTEXITCODE) { throw 'Exact four asset download failed; no retry' }
          # IDs are resolved only on the official runner and must remain stable across transfer.
          # Content identity remains the four independently reviewed byte-count/SHA256 pins.
          $afterText = gh api "repos/$env:GITHUB_REPOSITORY/releases/$resolvedReleaseId"
          if ($LASTEXITCODE) { throw 'Exact draft recheck failed; no retry' }
          $after = $afterText | ConvertFrom-Json
          if (($after.id -isnot [int] -and $after.id -isnot [long]) -or $after.id -ne $resolvedReleaseId -or $after.draft -isnot [bool] -or !$after.draft -or $after.prerelease -isnot [bool] -or !$after.prerelease -or $after.tag_name -cne $cfg.sourceReleaseTag -or $after.target_commitish -cne $cfg.sourceRecipeCommit -or $after.assets.Count -ne 4) { throw 'Source draft changed during transfer' }
          foreach ($name in $names) {
            $asset = @($after.assets | Where-Object { $_.name -ceq $name })
            if ($asset.Count -ne 1 -or ($asset[0].id -isnot [int] -and $asset[0].id -isnot [long]) -or $asset[0].id -ne $resolvedAssetIds[$name] -or $asset[0].size -ne $cfg.assets.$name.bytes -or $asset[0].state -cne 'uploaded' -or $asset[0].url -cne "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/assets/$($resolvedAssetIds[$name])") { throw 'Resolved asset identity changed during transfer' }
            if ($asset[0].digest -cne ('sha256:' + $cfg.assets.$name.sha256)) { throw 'Asset digest missing or changed during transfer' }
          }
          # Emit only already validated scalar metadata after the complete recheck.
          $metadataSummary = @('### Validated Build10 source IDs', '', "Release ID: $resolvedReleaseId", '', '| Asset | ID | Bytes | Digest |', '| --- | ---: | ---: | --- |')
          foreach ($name in $names) {
            $metadataSummary += "| $name | $($resolvedAssetIds[$name]) | $($cfg.assets.$name.bytes) | sha256:$($cfg.assets.$name.sha256) |"
          }
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ($metadataSummary -join [Environment]::NewLine) -Encoding utf8
          # Runtime is never started in this token-bearing step.

      - name: Verify whole archive, full inventory, provenance, built-in backports and official Node
        id: verify
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GH_TOKEN -or $env:GITHUB_TOKEN) { throw 'Credential forbidden outside transfer steps' }
          python -B (Join-Path $env:STREAM_RECIPE 'harness/verify-inputs.py') --verify-and-extract (Join-Path $env:STREAM_RECIPE 'approved-inputs.json') (Join-Path $env:RUNNER_TEMP 'stream-acceptance-downloads') (Join-Path $env:RUNNER_TEMP 'stream-acceptance-bundle')
          if ($LASTEXITCODE) { throw 'Full archive and inventory verification failed' }
          python -B (Join-Path $env:STREAM_RECIPE 'scripts/node-toolchain.py')
          if ($LASTEXITCODE) { throw 'Official Node verification failed' }

      - name: Run frozen synthetic compiled HTTP harness with mandatory measured program firewall
        id: runtime
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GH_TOKEN -or $env:GITHUB_TOKEN) { throw 'Credential forbidden in runtime step' }
          $cfgPath = Join-Path $env:STREAM_RECIPE 'approved-inputs.json'
          $cfg = Get-Content -LiteralPath $cfgPath -Raw | ConvertFrom-Json
          $configPin = (Get-FileHash -LiteralPath $cfgPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $os = Get-CimInstance Win32_OperatingSystem
          if ([long]$os.TotalVisibleMemorySize*1024 -lt $cfg.minTotalMemoryGiB*1GB -or [long]$os.FreePhysicalMemory*1024 -lt $cfg.minAvailableMemoryGiB*1GB) { throw 'Insufficient RAM; no larger runner or retry' }
          try {
            & (Join-Path $env:STREAM_RECIPE 'harness/Invoke-StreamAcceptance.ps1') -BundleRoot (Join-Path $env:RUNNER_TEMP 'stream-acceptance-bundle') -ManifestPath (Join-Path $env:RUNNER_TEMP 'stream-acceptance-downloads/runtime-files.json') -ManifestSha256 $cfg.assets.'runtime-files.json'.sha256 -ApprovedNodeExe $env:STREAM_NODE_EXE -NodeExeSha256 $env:STREAM_NODE_SHA256 -ConfigPath $cfgPath -ConfigSha256 $configPin -FirewallMode Required -Execute *> $null
          } catch { throw 'Synthetic compiled HTTP runtime failed or was blocked; inspect reconstructed reports only' }

      - name: Verify immutable recipe again and reconstruct exactly three public reports
        id: collect
        if: always() && steps.verify.outcome == 'success' && steps.runtime.outcome != 'skipped'
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GH_TOKEN -or $env:GITHUB_TOKEN) { throw 'Credential forbidden during report reconstruction' }
          @'
          import base64,hashlib,io,os,pathlib,re,zipfile
          scratch=pathlib.Path(os.environ['RUNNER_TEMP']); root=pathlib.Path(os.environ['STREAM_RECIPE'])
          archive=scratch/'stream-acceptance-checkout/stage1-stream-acceptance-recipe.zip.b64'
          expected='c481e9be34afb27408606224ff411a7fb218c0a340f1ef063be00c5f543c0689'; allowed=set(('LAB-NOTES.txt', 'approved-inputs.json', 'harness/Invoke-StreamAcceptance.ps1', 'harness/cleanup-owned.ps1', 'harness/oracles.mjs', 'harness/probe.mjs', 'harness/run-stream-acceptance.mjs', 'harness/verify-inputs.py', 'review-record.json', 'scripts/collector.py', 'scripts/contract.py', 'scripts/node-toolchain.py', 'workflow.template.yml'))
          assert archive.is_file() and archive.stat().st_size<3*1024*1024
          for p in (archive,*archive.parents): assert not p.is_symlink() and not getattr(p.lstat(),'st_file_attributes',0)&0x400
          encoded=archive.read_bytes(); assert re.fullmatch(rb'[A-Za-z0-9+/]+={0,2}\n',encoded)
          data=base64.b64decode(encoded[:-1],validate=True)
          assert base64.b64encode(data)+b'\n'==encoded and len(data)<2*1024*1024 and hashlib.sha256(data).hexdigest()==expected
          for current,dirs,files in os.walk(root,followlinks=False):
              for name in dirs+files:
                  p=pathlib.Path(current)/name
                  assert not p.is_symlink() and not getattr(p.lstat(),'st_file_attributes',0)&0x400
          assert {p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file()}==allowed
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              assert len(z.infolist())==len(allowed) and set(z.namelist())==allowed
              for name in allowed:
                  p=root/name
                  for ancestor in (p,*p.parents): assert not ancestor.is_symlink() and not getattr(ancestor.lstat(),'st_file_attributes',0)&0x400
                  assert hashlib.sha256(p.read_bytes()).digest()==hashlib.sha256(z.read(name)).digest()
          '@ | python -B -
          if ($LASTEXITCODE) { throw 'Recipe changed; collector execution and publication forbidden' }
          python -B (Join-Path $env:STREAM_RECIPE 'scripts/collector.py') --runtime-outcome '${{ steps.runtime.outcome }}'
          if ($LASTEXITCODE) { throw 'Report reconstruction failed; raw artifacts must never be uploaded' }

      - name: Retain exactly three reconstructed reports plus checksums in a new draft
        if: always() && steps.collect.outputs.reports_ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'stream-acceptance-public-reports'
          $names = @('stream-acceptance-sanitized.json','isolation-evidence.json','bundle-verification.json','SHA256SUMS.txt')
          $files = @(Get-ChildItem -LiteralPath $out -Force)
          if ($files.Count -ne 4) { throw 'Unexpected public report file set' }
          foreach ($file in $files) {
            if ($file.Name -cnotin $names -or $file.PSIsContainer -or ($file.Attributes -band [IO.FileAttributes]::ReparsePoint) -or $file.Length -gt 256KB) { throw 'Unexpected public report file' }
          }
          $lines = @(Get-Content -LiteralPath (Join-Path $out 'SHA256SUMS.txt'))
          if ($lines.Count -ne 3) { throw 'Unexpected public checksum set' }
          foreach ($name in $names[0..2]) {
            $line = (Get-FileHash -LiteralPath (Join-Path $out $name) -Algorithm SHA256).Hash.ToLowerInvariant() + '  ' + $name
            if (@($lines | Where-Object { $_ -ceq $line }).Count -ne 1) { throw 'Public report hash mismatch' }
          }
          $tag = "stage1-stream-acceptance-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $assets = @($names | ForEach-Object { Join-Path $out $_ })
          gh release create $tag @assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --draft --prerelease --title 'LAB ONLY: compiled HTTP stream acceptance evidence' --notes 'Synthetic compiled HTTP stream evidence only. Three reconstructed reports and checksums. No deployment, real provider, GPU, browser or Site persistence approval.'
          if ($LASTEXITCODE) { throw 'Draft evidence transfer failed; no automatic retry' }

      - name: Preserve truthful failed or blocked result
        if: always() && (steps.runtime.outcome != 'success' || steps.collect.outputs.acceptance_passed != 'true')
        run: throw 'Compiled HTTP stream acceptance failed, was blocked or did not run; no success may be inferred from absent reports'
