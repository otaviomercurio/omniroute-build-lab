name: Manual derived Windows runtime acceptance

on:
  workflow_dispatch:
    inputs:
      approve_synthetic_runtime_draft:
        description: "Run the reviewed compiled bundle on a standard free public runner and retain only five sanitized reports"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: manual-windows-runtime-acceptance
  cancel-in-progress: false

jobs:
  accept-and-retain:
    if: github.event_name == 'workflow_dispatch' && inputs.approve_synthetic_runtime_draft && github.event.repository.private == false
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Fetch exact public workflow commit anonymously and verify text recipe
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_SERVER_URL -ne 'https://github.com' -or $env:GITHUB_REPOSITORY -ne 'otaviomercurio/omniroute-build-lab') { throw 'Wrong repository or host' }
          if ($env:GITHUB_SHA -notmatch '^[0-9a-f]{40}$') { throw 'Invalid exact commit' }
          $checkout = Join-Path $env:RUNNER_TEMP 'runtime-acceptance-checkout'
          if (Test-Path -LiteralPath $checkout) { throw 'Fresh checkout required' }
          git init $checkout
          if ($LASTEXITCODE) { throw 'git init failed' }
          git -C $checkout remote add origin "https://github.com/$env:GITHUB_REPOSITORY.git"
          if ($LASTEXITCODE) { throw 'git remote failed' }
          git -C $checkout -c credential.helper= fetch --depth=1 origin $env:GITHUB_SHA
          if ($LASTEXITCODE) { throw 'Anonymous fetch failed' }
          git -C $checkout -c core.autocrlf=false checkout --detach FETCH_HEAD
          if ($LASTEXITCODE) { throw 'Exact checkout failed' }
          @'
          import base64,hashlib,io,os,pathlib,re,stat,zipfile
          scratch=pathlib.Path(os.environ['RUNNER_TEMP'])
          archive=scratch/'runtime-acceptance-checkout'/'runtime-acceptance-recipe.zip.b64'
          expected='a461b3d5d9daa12b70c65bfa8c32ece71872f82bf268e57a18e7d3dae1bf8629'
          assert archive.stat().st_size<3*1024*1024, 'Encoded recipe exceeds bound'
          encoded=archive.read_bytes()
          assert re.fullmatch(rb'[A-Za-z0-9+/]+={0,2}\n', encoded), 'Canonical single-line Base64 plus LF required'
          data=base64.b64decode(encoded[:-1], validate=True)
          assert base64.b64encode(data)+b'\n'==encoded, 'Noncanonical Base64 rejected'
          assert len(data)<2*1024*1024 and hashlib.sha256(data).hexdigest()==expected, 'Recipe ZIP hash mismatch'
          allowed={'LAB-ACCEPTANCE-NOTES.txt','approved-inputs.json','build-inputs.json','derivation/approval.json','derivation/remote-result.json','harness/Invoke-RuntimeAcceptance.ps1','harness/README-HARDENING.txt','harness/README-REVISAO-RUNTIME.txt','harness/braces-acceptance.cjs','harness/braces/baseline-result.json','harness/braces/guard-receipt.json','harness/braces/run-remote.cjs','harness/braces/selection.json','harness/check-hardening.cjs','harness/compiled-selection.cjs','harness/probe.mjs','harness/run-combined.mjs','harness/run-runtime.mjs','harness/selections.review-only.json','scripts/acceptance.py','scripts/braces_reports.py','scripts/derive-runtime.py','scripts/hardening_reports.py','scripts/sanitize_reports.py'}
          dest=scratch/'runtime-acceptance-recipe'
          assert not dest.exists()
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              infos=z.infolist()
              assert len(infos)==len(allowed) and {i.filename for i in infos}==allowed
              assert sum(i.file_size for i in infos)<2*1024*1024
              assert all(not i.flag_bits&1 and i.compress_type in (0,8) and stat.S_IFMT(i.external_attr>>16) in (0,stat.S_IFREG) and not i.external_attr&0x400 for i in infos)
              assert z.testzip() is None
              dest.mkdir()
              for i in infos:
                  target=(dest/i.filename).resolve()
                  assert target.is_relative_to(dest.resolve())
                  target.parent.mkdir(parents=True,exist_ok=True)
                  with target.open('xb') as f:f.write(z.read(i))
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:f.write('ACCEPTANCE_RECIPE='+str(dest)+'\nPYTHONDONTWRITEBYTECODE=1\n')
          '@ | python -
          if ($LASTEXITCODE) { throw 'Recipe ZIP verification failed' }
          python (Join-Path $env:RUNNER_TEMP 'runtime-acceptance-recipe/scripts/acceptance.py') pins
          if ($LASTEXITCODE) { throw 'Explicit approvals remain missing or inconsistent; no runtime download' }

      - name: Download exactly four approved source draft assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $cfg = Get-Content -LiteralPath (Join-Path $env:ACCEPTANCE_RECIPE 'approved-inputs.json') -Raw | ConvertFrom-Json
          $draftRefText = gh release view $cfg.sourceReleaseTag --repo $env:GITHUB_REPOSITORY --json databaseId
          if ($LASTEXITCODE) { throw 'Approved source draft lookup failed; no retry' }
          # LAB_DRAFT_ID_PARSE_BEGIN
          $draftRef = $draftRefText | ConvertFrom-Json
          if ($null -eq $draftRef -or ($draftRef.databaseId -isnot [int] -and $draftRef.databaseId -isnot [long]) -or $draftRef.databaseId -le 0) { throw 'Invalid draft release ID' }
          # LAB_DRAFT_ID_PARSE_END
          $releaseText = gh api "repos/$env:GITHUB_REPOSITORY/releases/$($draftRef.databaseId)"
          if ($LASTEXITCODE) { throw 'Approved source draft does not exist; no retry' }
          # LAB_DRAFT_IDENTITY_PARSE_BEGIN
          $release = $releaseText | ConvertFrom-Json
          if ($null -eq $release -or $release.id -ne $draftRef.databaseId -or $release.draft -isnot [bool] -or !$release.draft -or $release.tag_name -cne $cfg.sourceReleaseTag -or $release.target_commitish -cne $cfg.sourceRecipeCommit) { throw 'Wrong source draft, tag or target commit' }
          # LAB_DRAFT_IDENTITY_PARSE_END
          $names = @('runtime-win-x64.zip','runtime-files.json','provenance.json','SHA256SUMS.txt')
          if ($release.assets.Count -ne 4) { throw 'Source asset count differs' }
          foreach ($name in $names) {
            $asset = @($release.assets | Where-Object name -EQ $name)
            if ($asset.Count -ne 1 -or $asset[0].size -gt $cfg.baseAssets.$name.maxBytes) { throw 'Source asset absent, duplicate or oversized' }
          }
          $incoming = Join-Path $env:RUNNER_TEMP 'acceptance-base-downloads'
          if (Test-Path -LiteralPath $incoming) { throw 'Fresh download directory required' }
          New-Item -ItemType Directory -Path $incoming | Out-Null
          gh release download $cfg.sourceReleaseTag --repo $env:GITHUB_REPOSITORY --dir $incoming --pattern runtime-win-x64.zip --pattern runtime-files.json --pattern provenance.json --pattern SHA256SUMS.txt
          if ($LASTEXITCODE) { throw 'Source asset download failed; no retry' }

      - name: Derive exactly two reviewed vendor files without executing the runtime
        id: derive
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GH_TOKEN -or $env:GITHUB_TOKEN) { throw 'Credential present during derivation' }
          python (Join-Path $env:ACCEPTANCE_RECIPE 'scripts/derive-runtime.py') --base-dir (Join-Path $env:RUNNER_TEMP 'acceptance-base-downloads') --payload-dir (Join-Path $env:ACCEPTANCE_RECIPE 'harness/braces') --approval (Join-Path $env:ACCEPTANCE_RECIPE 'derivation/approval.json') --remote-result (Join-Path $env:ACCEPTANCE_RECIPE 'derivation/remote-result.json') --output-parent $env:RUNNER_TEMP --output-name acceptance-downloads --approved-derive
          if ($LASTEXITCODE) { throw 'Exact derived runtime preparation failed; runtime is forbidden' }

      - name: Verify approvals, complete manifest, provenance, CRC and official Node archive
        id: verify
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GH_TOKEN -or $env:GITHUB_TOKEN) { throw 'Credential present outside token steps' }
          python (Join-Path $env:ACCEPTANCE_RECIPE 'scripts/acceptance.py') verify $env:RUNNER_TEMP
          if ($LASTEXITCODE) { throw 'Input verification failed; runtime is forbidden' }

      - name: Run frozen synthetic harness without build or credential environment
        id: runtime
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GH_TOKEN -or $env:GITHUB_TOKEN) { throw 'Credential present in runtime step' }
          $cfg = Get-Content -LiteralPath (Join-Path $env:ACCEPTANCE_RECIPE 'approved-inputs.json') -Raw | ConvertFrom-Json
          $os = Get-CimInstance Win32_OperatingSystem
          $resources = @{totalMemoryBytes=[long]$os.TotalVisibleMemorySize*1024; availableMemoryBytes=[long]$os.FreePhysicalMemory*1024}
          if ($resources.totalMemoryBytes -lt $cfg.minTotalMemoryGiB*1GB -or $resources.availableMemoryBytes -lt $cfg.minAvailableMemoryGiB*1GB) { throw 'Insufficient runtime RAM margin; no larger runner or retry' }
          $resources | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'acceptance-resources.json') -Encoding utf8
          & (Join-Path $env:ACCEPTANCE_RECIPE 'harness/Invoke-RuntimeAcceptance.ps1') -BundleRoot (Join-Path $env:RUNNER_TEMP 'acceptance-bundle') -ManifestPath (Join-Path $env:RUNNER_TEMP 'acceptance-downloads/runtime-files.json') -ManifestSha256 $cfg.assets.'runtime-files.json'.sha256 -ApprovedNodeExe $env:ACCEPTANCE_NODE_EXE -NodeExeSha256 $env:ACCEPTANCE_NODE_SHA256 -FirewallMode Auto -Execute

      - name: Recheck recipe bytes and reconstruct five allowlisted reports
        id: collect
        if: always() && steps.verify.outcome == 'success' && steps.runtime.outcome != 'skipped'
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GH_TOKEN -or $env:GITHUB_TOKEN) { throw 'Credential present during collection' }
          @'
          import base64,hashlib,io,os,pathlib,re,zipfile
          scratch=pathlib.Path(os.environ['RUNNER_TEMP']); root=pathlib.Path(os.environ['ACCEPTANCE_RECIPE'])
          archive=scratch/'runtime-acceptance-checkout'/'runtime-acceptance-recipe.zip.b64'
          expected='a461b3d5d9daa12b70c65bfa8c32ece71872f82bf268e57a18e7d3dae1bf8629'
          assert archive.stat().st_size<3*1024*1024, 'Encoded recipe exceeds bound'
          encoded=archive.read_bytes()
          assert re.fullmatch(rb'[A-Za-z0-9+/]+={0,2}\n', encoded), 'Canonical single-line Base64 plus LF required'
          data=base64.b64decode(encoded[:-1], validate=True)
          assert base64.b64encode(data)+b'\n'==encoded, 'Noncanonical Base64 rejected'
          assert len(data)<2*1024*1024 and hashlib.sha256(data).hexdigest()==expected, 'Recipe ZIP hash mismatch'
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              names={i.filename for i in z.infolist()}
              assert {p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file()}==names
              for name in names:
                  p=root/name
                  assert not p.is_symlink() and not getattr(p.lstat(),'st_file_attributes',0)&0x400
                  assert hashlib.sha256(p.read_bytes()).digest()==hashlib.sha256(z.read(name)).digest()
          '@ | python -
          if ($LASTEXITCODE) { throw 'Recipe changed after runtime; do not execute collector' }
          python (Join-Path $env:ACCEPTANCE_RECIPE 'scripts/acceptance.py') collect $env:RUNNER_TEMP
          if ($LASTEXITCODE) { throw 'Report collection failed; do not publish raw files' }

      - name: Retain exactly five sanitized evidence assets in a new draft
        if: always() && steps.collect.outputs.reports_ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'acceptance-public-reports'
          $names = @('acceptance-sanitized.json','isolation-evidence.json','bundle-verification.json','hardening-sanitized.json','SHA256SUMS.txt')
          $files = @(Get-ChildItem -LiteralPath $out -Force)
          if ($files.Count -ne 5) { throw 'Public report set differs' }
          foreach ($file in $files) {
            if ($file.Name -notin $names -or $file.PSIsContainer -or ($file.Attributes -band [IO.FileAttributes]::ReparsePoint) -or $file.Length -gt 4MB) { throw 'Unapproved report file' }
          }
          $lines = @(Get-Content -LiteralPath (Join-Path $out 'SHA256SUMS.txt'))
          if ($lines.Count -ne 4) { throw 'Report checksum inventory differs' }
          foreach ($name in $names[0..3]) {
            $expectedLine = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $out $name)).Hash.ToLowerInvariant() + '  ' + $name
            if (@($lines | Where-Object { $_ -ceq $expectedLine }).Count -ne 1) { throw 'Sanitized report hash differs' }
          }
          $tag = "runtime-acceptance-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $assets = @($names | ForEach-Object { Join-Path $out $_ })
          gh release create $tag @assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --draft --prerelease --title 'LAB ONLY: compiled runtime acceptance evidence' --notes-file (Join-Path $env:ACCEPTANCE_RECIPE 'LAB-ACCEPTANCE-NOTES.txt')
          if ($LASTEXITCODE) { throw 'Evidence retention failed; no automatic retry' }

      - name: Preserve truthful failed or blocked job status
        if: always() && (steps.runtime.outcome != 'success' || steps.collect.outputs.acceptance_passed != 'true')
        run: throw 'Compiled runtime acceptance failed, was blocked, or did not run; review sanitized evidence if present'
